name: publish catalog

# After every push to main, the index the app reads is rebuilt and published
# to the orphan branch `catalog`: extensions/catalog.json (the slim search
# index) and locks/<id>.json (one per extension: the hashed file list,
# dependencies, permissions, discussion, author, license and the commit the
# files are served from). Only this workflow ever writes them, so no pull
# request touches the index and two contributors never collide on it; the
# branch always holds exactly one commit, force pushed, so its history never
# grows. The app fetches raw.githubusercontent.com/hercstack/plumesql/catalog/...
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build the index for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin catalog:refs/remotes/origin/catalog || true
          mkdir -p /tmp/index
          node extensions/tools/catalog.mjs --write --commit "$GITHUB_SHA" --out /tmp/index
      - name: Publish to the catalog branch
        run: |
          set -e
          rm -rf /tmp/publish && mkdir /tmp/publish && cd /tmp/publish
          git init -q -b catalog
          cp -r /tmp/index/. .
          printf '# The PlumeSQL Extensions Marketplace index\n\nGenerated by the publish workflow from the manifests on main at %s. Never edited by hand.\n' "$GITHUB_SHA" > README.md
          git add -A
          git -c user.name=plumesql-catalog -c user.email=catalog@plume.hercstack.com commit -q -m "catalog: index of ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalog:catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
